<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div id="login-container">
      <h1>FIFA World Cup Quiz</h1>
      <input type="text" id="player-name" placeholder="Enter your name">
      <button id="submit-btn" class="submit-btn btn">Start Quiz</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-container" class="hide">
      <div id="score-container">Score: <span id="score">0</span></div>
      <div id="question-counter">Question <span id="current-question">1</span>/5</div>
      <div id="question-container">
        <div id="question">Question</div>
        <div id="answer-buttons" class="btn-grid">
          <!-- Answer buttons will be generated here -->
        </div>
      </div>
      <div class="controls">
        <button id="next-btn" class="next-btn btn hide">Next</button>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-container" class="hide">
      <h1>Quiz Completed!</h1>
      <h2 id="player-result">Well done, <span id="result-name"></span>!</h2>
      <div id="final-score">Your score: <span id="final-score-value">0</span>/5</div>
      <button id="restart-btn" class="start-btn btn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
